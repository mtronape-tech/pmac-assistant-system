version: '3.8'

services:
  # PostgreSQL с расширением TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: pmac-postgres
    environment:
      POSTGRES_DB: pmac_assistant
      POSTGRES_USER: pmac_user
      POSTGRES_PASSWORD: pmac_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pmac-network

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: pmac-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pmac-network

  # Vector Database (Weaviate)
  weaviate:
    image: semitechnologies/weaviate:1.22.4
    container_name: pmac-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-openai,text2vec-cohere,text2vec-huggingface,ref2vec-centroid,generative-openai,qna-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - pmac-network

  # MCP Server
  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile.dev
    container_name: pmac-mcp-server
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PMAC_MODE: simulation
      DATABASE_URL: postgresql://pmac_user:pmac_password@postgres:5432/pmac_assistant
      REDIS_URL: redis://redis:6379
      WEAVIATE_URL: http://weaviate:8080
    volumes:
      - ./services/mcp-server:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - weaviate
    networks:
      - pmac-network

  # Knowledge Base Service
  knowledge-base:
    build:
      context: ./services/knowledge-base
      dockerfile: Dockerfile.dev
    container_name: pmac-knowledge-base
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_CLASS_NAME: PMACDocument
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b:free}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    volumes:
      - ./services/knowledge-base:/app
      - /app/node_modules
      - knowledge_uploads:/app/uploads
      - knowledge_logs:/app/logs
    depends_on:
      - weaviate
    networks:
      - pmac-network

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.dev
    container_name: pmac-api-gateway
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      MCP_SERVER_URL: http://mcp-server:3001
      KNOWLEDGE_BASE_URL: http://knowledge-base:3002
      DATABASE_URL: postgresql://pmac_user:pmac_password@postgres:5432/pmac_assistant
      REDIS_URL: redis://redis:6379
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    depends_on:
      - mcp-server
      - knowledge-base
      - postgres
      - redis
    networks:
      - pmac-network

  # PMAC Control Service
  pmac-control:
    build:
      context: ./services/pmac-control
      dockerfile: Dockerfile.dev
    container_name: pmac-pmac-control
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      PORT: 3007
      PMAC_MODE: simulation
      LOG_LEVEL: info
    volumes:
      - ./services/pmac-control:/app
      - /app/node_modules
    networks:
      - pmac-network

  # Data Collection Service
  data-collection:
    build:
      context: ./services/data-collection
      dockerfile: Dockerfile.dev
    container_name: pmac-data-collection
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmac_assistant
      DB_USER: pmac_user
      DB_PASSWORD: pmac_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PMAC_CONTROL_BASE_URL: http://pmac-control:3007
      PMAC_CONTROL_ENABLED: true
      COLLECTION_ENABLED: true
      COLLECTION_INTERVAL: 5000
      COLLECTION_BATCH_SIZE: 50
      LOG_LEVEL: info
    volumes:
      - ./services/data-collection:/app
      - /app/node_modules
      - data_collection_logs:/app/logs
    depends_on:
      - postgres
      - redis
      - pmac-control
    networks:
      - pmac-network

  # Analytics Service (Python)
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile.dev
    container_name: pmac-analytics
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://pmac_user:pmac_password@postgres:5432/pmac_assistant
      REDIS_URL: redis://redis:6379
    volumes:
      - ./services/analytics:/app
    depends_on:
      - postgres
      - redis
    networks:
      - pmac-network

  # Recommendations Service (Python)
  recommendations:
    build:
      context: ./services/recommendations
      dockerfile: Dockerfile.dev
    container_name: pmac-recommendations
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://pmac_user:pmac_password@postgres:5432/pmac_assistant
      REDIS_URL: redis://redis:6379
    volumes:
      - ./services/recommendations:/app
    depends_on:
      - postgres
      - redis
    networks:
      - pmac-network

  # Web Frontend
  web-frontend:
    build:
      context: ./packages/web-frontend
      dockerfile: Dockerfile.dev
    container_name: pmac-web-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002
      NEXT_PUBLIC_WS_URL: ws://localhost:3002
    volumes:
      - ./packages/web-frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway
    networks:
      - pmac-network

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  knowledge_uploads:
  knowledge_logs:
  data_collection_logs:

networks:
  pmac-network:
    driver: bridge
